name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # vitest 5 needs Node 22.12 or later; older Node versions are covered by the compat job.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.cjs "=IF(B2>1, \"a\", \"b\")" --from excel --to sql --columns B=x:number

  # The SQL tests run on PGlite (PostgreSQL 17, C.UTF-8) above; here they run on real servers with the
  # en_US.UTF-8 locale most installs use. PostgreSQL 15 is the oldest supported (regexp_instr).
  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [15, 16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_INITDB_ARGS: --locale=en_US.UTF-8 --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FC_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: psql "$FC_TEST_DATABASE_URL" -Atc "SELECT version(), datctype FROM pg_database WHERE datname = 'postgres'"
      - run: npm test

  # The package supports Node >= 18: build on Node 22, then run the built package on older versions.
  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: node dist/cli.cjs "=IF(B2>1, \"a\", \"b\")" --from excel --to sql --columns B=x:number
      - name: CommonJS import
        run: >-
          node -e 'const { compile } = require("./dist/index.cjs");
          const f = compile("=EDATE(DATE(2024,1,31),1)", { from: "excel", to: "js" });
          if (f.evaluate({}) !== 45351) throw new Error("got " + f.evaluate({}));'
      - name: ESM import
        run: >-
          node --input-type=module -e 'import { compile } from "./dist/index.js";
          const f = compile("IF({a} > 1, \"big\", \"small\")", { from: "airtable", to: "js" });
          if (f.evaluate({ a: 2 }) !== "big") throw new Error("got " + f.evaluate({ a: 2 }));'
